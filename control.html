<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#11181d">
<title>Control del robot</title>
<style>
  :root { --fondo:#11181d; --tarjeta:#1b252c; --borde:#2c3a44; --texto:#e8eef1; --suave:#9fb2bd; --acento:#46c3ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--fondo); color:var(--texto); font-family:system-ui, sans-serif; }
  main { max-width:560px; margin:0 auto; padding:18px 16px 40px; display:flex; flex-direction:column; gap:16px; }
  h1 { margin:4px 0 0; font-size:24px; }
  h2 { margin:0 0 8px; font-size:16px; color:var(--acento); }
  section { background:var(--tarjeta); border:1px solid var(--borde); border-radius:14px; padding:14px; }
  label { display:block; font-size:14px; color:var(--suave); margin-bottom:6px; }
  textarea, input { width:100%; background:#0d1418; color:var(--texto); border:1px solid var(--borde); border-radius:10px; padding:10px; font-size:16px; font-family:inherit; }
  textarea { min-height:90px; resize:vertical; }
  .fila { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  button { flex:1; min-height:46px; border:none; border-radius:10px; background:#24323b; color:var(--texto); font-size:15px; padding:8px 10px; cursor:pointer; }
  button.principal { background:var(--acento); color:#06131a; font-weight:700; }
  .grilla { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px; }
  #estado { font-size:13px; color:var(--suave); }
  #historial { font-size:13px; color:var(--suave); white-space:pre-wrap; max-height:160px; overflow:auto; }
  .aviso { background:#3a2a12; border-color:#6b4d1f; color:#f5d9a8; }
</style>
</head>
<body>
<main>
  <h1>📡 Control del robot</h1>
  <div id="estado">Conectando…</div>

  <section id="sinCanal" class="aviso" hidden>
    <h2 style="color:#f5c06b">Falta el link del robot</h2>
    <p style="margin:0;font-size:14px;line-height:1.5">Abrí esta página con el link que aparece en el robot: engranaje → <b>Control remoto</b> → Copiar link.</p>
  </section>

  <section>
    <h2>Mensaje para decirle ahora</h2>
    <label for="mensaje">Ej: "es hora de juntar los juguetes", "a lavarse los dientes"</label>
    <textarea id="mensaje"></textarea>
    <div class="fila">
      <button class="principal" id="aSuManera">✨ Que lo diga a su manera</button>
      <button id="talCual">🗣️ Tal cual</button>
    </div>
  </section>

  <section>
    <h2>Enseñanzas</h2>
    <label for="ensenanzas">Una por renglón. Las va metiendo en la charla, jugando. Reemplaza las que tenga el robot.</label>
    <textarea id="ensenanzas" placeholder="Juntar los juguetes después de jugar&#10;Lavarse los dientes antes de dormir&#10;Decir por favor y gracias"></textarea>
    <div class="fila"><button id="guardarEns">💾 Mandar al robot</button></div>
  </section>

  <section>
    <h2>Órdenes rápidas</h2>
    <div class="grilla">
      <button data-orden="dormir">💤 Dormir</button>
      <button data-orden="despertar">☀️ Despertar</button>
      <button data-orden="charlaOn">🎤 Charlar</button>
      <button data-orden="cancion1">🎵 Canción 1</button>
      <button data-orden="pararMusica">⏹ Parar música</button>
      <button data-orden="charlaOff">🔇 Dejar de escuchar</button>
    </div>
    <label for="youtube" style="margin-top:12px">Poner una canción de YouTube (si está activado en el robot)</label>
    <div class="fila" style="margin-top:0"><input id="youtube" placeholder="Ej: el sapo pepe"><button id="ponerYT" style="flex:0 0 auto">▶</button></div>
  </section>

  <section>
    <h2>Caras</h2>
    <div class="grilla">
      <button data-cara="contento">😊 Contento</button>
      <button data-cara="risa">😆 Risa</button>
      <button data-cara="enamorado">😍 Enamorado</button>
      <button data-cara="sorpresa">😮 Sorpresa</button>
      <button data-cara="triste">😢 Triste</button>
      <button data-cara="mareado">😵 Mareado</button>
    </div>
  </section>

  <section>
    <h2>Enviado</h2>
    <div id="historial"></div>
  </section>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  // El link trae el canal secreto: lo guardamos y lo sacamos de la barra de direcciones
  let canal = '';
  const m = /canal=([a-z0-9-]+)/i.exec(location.hash);
  try {
    if (m) { canal = m[1]; localStorage.setItem('robot_canal', canal); history.replaceState(null, '', location.pathname); }
    else canal = localStorage.getItem('robot_canal') || '';
  } catch (e) { if (m) canal = m[1]; }
  if (!canal) { $('sinCanal').hidden = false; $('estado').textContent = 'Sin conectar'; }
  else $('estado').textContent = 'Listo para mandar ✔ (el robot tiene que estar prendido y con internet)';

  function anotar(t) {
    const h = new Date().toLocaleTimeString('es-AR', { hour:'2-digit', minute:'2-digit' });
    $('historial').textContent = `${h} ${t}\n` + $('historial').textContent;
  }
  async function enviar(obj, descripcion) {
    if (!canal) { $('estado').textContent = 'Falta el link del robot'; return; }
    try {
      const r = await fetch('https://ntfy.sh/' + canal, { method:'POST', body:JSON.stringify(obj) });
      if (!r.ok) throw new Error('error ' + r.status);
      anotar('✔ ' + descripcion);
      $('estado').textContent = 'Enviado ✔';
    } catch (e) { anotar('✖ ' + descripcion + ' (' + e.message + ')'); $('estado').textContent = 'No se pudo enviar: ¿hay internet?'; }
  }
  $('aSuManera').addEventListener('click', () => { const t = $('mensaje').value.trim(); if (!t) return; enviar({ tipo:'decirIA', texto:t }, 'A su manera: ' + t); $('mensaje').value = ''; });
  $('talCual').addEventListener('click', () => { const t = $('mensaje').value.trim(); if (!t) return; enviar({ tipo:'decir', texto:t }, 'Tal cual: ' + t); $('mensaje').value = ''; });
  try { $('ensenanzas').value = localStorage.getItem('robot_ensenanzas') || ''; } catch (e) {}
  $('guardarEns').addEventListener('click', () => {
    const t = $('ensenanzas').value.trim();
    try { localStorage.setItem('robot_ensenanzas', t); } catch (e) {}
    enviar({ tipo:'ensenanzas', texto:t }, 'Enseñanzas actualizadas');
  });
  const ORDENES = {
    dormir:[{ tipo:'dormir' }, 'Dormir'], despertar:[{ tipo:'despertar' }, 'Despertar'],
    charlaOn:[{ tipo:'charla', prender:true }, 'Charlar'], charlaOff:[{ tipo:'charla', prender:false }, 'Dejar de escuchar'],
    cancion1:[{ tipo:'cancion', numero:1 }, 'Canción 1'], pararMusica:[{ tipo:'pararMusica' }, 'Parar música'],
  };
  document.querySelectorAll('[data-orden]').forEach(b => b.addEventListener('click', () => { const [o, d] = ORDENES[b.dataset.orden]; enviar(o, d); }));
  document.querySelectorAll('[data-cara]').forEach(b => b.addEventListener('click', () => enviar({ tipo:'cara', cara:b.dataset.cara }, 'Cara: ' + b.dataset.cara)));
  $('ponerYT').addEventListener('click', () => { const t = $('youtube').value.trim(); if (!t) return; enviar({ tipo:'youtube', texto:t }, 'YouTube: ' + t); });
})();
</script>
</body>
</html>
